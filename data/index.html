<!DOCTYPE html>

<html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ESP32 Robot Control</title>
	    <link rel="stylesheet" href="index.css">
    </head>



    <body>
        <div class="container">
            <div id="joystick">
                <div id="stick"></div>
            </div>

            <div class="slider-box">
                <label>Servo 1</label>
                <input type="range" min="0" max="180" value="90"
                    oninput="sendServo(1, this.value)">
            </div>

            <div class="slider-box">
                <label>Servo 2</label>
                <input type="range" min="0" max="180" value="90"
                    oninput="sendServo(2, this.value)">
            </div>

            <button id="estop" onclick="toggleEStop()">EMERGENCY STOP</button>

        </div>

	<div id="circular-dial-container">
        <svg width="200" height="200" viewBox="0 0 120 120" id="circular-dial">
            <!-- Dial background -->
            <circle cx="60" cy="60" r="50" fill="#eee" stroke="#333" stroke-width="2"></circle>
            <!-- Dial handle (line that rotates) -->
            <line x1="60" y1="60" x2="105" y2="60" stroke="#f00" stroke-width="3" id="dial-handle" transform="rotate(0, 60, 60)"></line>
        </svg>
        <p>Base-angle: <span id="dial-value">90</span></p>
	</div>


    <script src="index.js"></script>


    </body>
    
</html>
